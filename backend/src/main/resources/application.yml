spring:
  profiles:
    # Local runs use "dev" (seeds demo data). Deployments set SPRING_PROFILES_ACTIVE=prod.
    default: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/libranet?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}   # set in your environment; never commit it
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: ${PORT:8081}

app:
  jwt:
    secret: ${APP_JWT_SECRET:}   # required, at least 32 bytes (startup fails otherwise)
    expiration: 86400000  # 24 hours in ms
  file:
    upload-dir: ./uploads
  seed:
    admin-password: ${APP_SEED_ADMIN_PASSWORD:}   # dev profile only
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

logging:
  level:
    com.libranet: DEBUG
    org.springframework.security: WARN
